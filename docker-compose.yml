services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: storm_engine
    ports:
      - "5433:5432"
    volumes:
      # Updated mount point for Postgres 18+ compatibility
      - ./postgres_data:/var/lib/postgresql
